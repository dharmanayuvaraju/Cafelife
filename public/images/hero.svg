<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0f08" />
      <stop offset="40%" stop-color="#2c160c" />
      <stop offset="80%" stop-color="#442111" />
      <stop offset="100%" stop-color="#6e371a" />
    </linearGradient>

    <!-- Warm Saffron Glow -->
    <radialGradient id="saffronGlow" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f39c12" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#d35400" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1c0f08" stop-opacity="0" />
    </radialGradient>

    <!-- Brass / Copper Kettle Gradient -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="50%" stop-color="#fda085" />
      <stop offset="100%" stop-color="#b85d19" />
    </linearGradient>

    <!-- Chai Liquid Gradient -->
    <linearGradient id="chaiLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d6a5" />
      <stop offset="25%" stop-color="#c67d38" />
      <stop offset="100%" stop-color="#803f13" />
    </linearGradient>

    <!-- Glass Highlights -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Biscuit Texture Gradient -->
    <linearGradient id="biscuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbe4b5" />
      <stop offset="50%" stop-color="#e6b36a" />
      <stop offset="100%" stop-color="#b67a30" />
    </linearGradient>
  </defs>

  <!-- Deep Warm Canvas Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Ambient Golden Saffron Flare -->
  <circle cx="1050" cy="450" r="650" fill="url(#saffronGlow)" />

  <!-- Architectural Hyderabadi Islamic Arches Silhouette (Subtle in background) -->
  <g opacity="0.08" fill="#f6d365">
    <path d="M 0,900 L 0,350 Q 150,150 300,350 L 300,900 Z" />
    <path d="M 300,900 L 300,350 Q 450,150 600,350 L 600,900 Z" />
    <path d="M 600,900 L 600,350 Q 750,150 900,350 L 900,900 Z" />
    <path d="M 900,900 L 900,350 Q 1050,150 1200,350 L 1200,900 Z" />
    <path d="M 1200,900 L 1200,350 Q 1350,150 1500,350 L 1500,900 Z" />
    <!-- Minaret accents -->
    <rect x="290" y="100" width="20" height="800" rx="6" />
    <rect x="590" y="100" width="20" height="800" rx="6" />
    <rect x="890" y="100" width="20" height="800" rx="6" />
    <rect x="1190" y="100" width="20" height="800" rx="6" />
  </g>

  <!-- Cafe Counter / Wooden Table Base -->
  <path d="M 0,650 Q 800,620 1600,650 L 1600,900 L 0,900 Z" fill="#140b06" />
  <path d="M 0,650 Q 800,620 1600,650 L 1600,665 Q 800,635 0,665 Z" fill="#6d3c1e" opacity="0.5" />

  <!-- STEAM SWIRLS (Delicate rising aroma) -->
  <g stroke="#ffffff" stroke-width="3" fill="none" opacity="0.25" stroke-linecap="round">
    <path d="M 1120,430 Q 1100,380 1125,330 T 1115,250 T 1130,180" />
    <path d="M 1150,420 Q 1170,360 1140,310 T 1160,230 T 1145,160" stroke-width="4" opacity="0.3" />
    <path d="M 1180,440 Q 1200,390 1175,340 T 1195,260" />
    <path d="M 850,380 Q 830,320 860,260 T 840,190" stroke-width="2" opacity="0.2" />
  </g>

  <!-- TRADITIONAL DUM CHAI SAMOVAR / KETTLE -->
  <g id="samovar" transform="translate(680, 240)">
    <!-- Base stand -->
    <path d="M 100,430 L 220,430 L 200,460 L 120,460 Z" fill="#8d4918" />
    <!-- Kettle body -->
    <path d="M 80,430 C 40,320 60,220 160,200 C 260,220 280,320 240,430 Z" fill="url(#brassGrad)" />
    <!-- Lid and knob -->
    <path d="M 110,200 Q 160,160 210,200 Z" fill="#f6d365" />
    <circle cx="160" cy="165" r="14" fill="#d35400" />
    <!-- Brass handle -->
    <path d="M 60,280 C 10,280 10,380 75,400" fill="none" stroke="#f6d365" stroke-width="14" stroke-linecap="round" />
    <!-- Brass spout -->
    <path d="M 245,350 Q 300,330 310,260" fill="none" stroke="#f6d365" stroke-width="16" stroke-linecap="round" />
    <!-- Brass body highlight rings -->
    <ellipse cx="160" cy="300" rx="85" ry="12" fill="none" stroke="#fff" stroke-width="2" opacity="0.3" />
    <ellipse cx="160" cy="350" rx="95" ry="14" fill="none" stroke="#fff" stroke-width="2" opacity="0.3" />
  </g>

  <!-- AUTHENTIC CUTTING IRANI CHAI GLASS -->
  <g id="chaiGlass" transform="translate(1060, 420)">
    <!-- Saucer plate -->
    <ellipse cx="90" cy="240" rx="140" ry="25" fill="#2a150c" />
    <ellipse cx="90" cy="235" rx="130" ry="20" fill="url(#brassGrad)" />
    <ellipse cx="90" cy="233" rx="80" ry="12" fill="#582a10" />

    <!-- Glass Body (Fluted Cutting Glass) -->
    <path d="M 40,70 L 60,220 Q 90,230 120,220 L 140,70 Q 90,60 40,70 Z" fill="rgba(255,255,255,0.08)" stroke="#f6d365" stroke-width="1.5" />

    <!-- Rich Chai Liquid -->
    <path d="M 46,95 L 62,215 Q 90,223 118,215 L 134,95 Q 90,88 46,95 Z" fill="url(#chaiLiquid)" />

    <!-- Malai / Cream Layer on Top -->
    <ellipse cx="90" cy="95" rx="44" ry="9" fill="#fdf0d5" />
    <ellipse cx="90" cy="97" rx="38" ry="6" fill="#f5dbb0" />

    <!-- Glass Vertical Flutes (Irani Chai Glass Facets) -->
    <path d="M 60,75 L 72,215" stroke="url(#glassShine)" stroke-width="3" />
    <path d="M 80,73 L 84,218" stroke="url(#glassShine)" stroke-width="4" />
    <path d="M 100,73 L 96,218" stroke="url(#glassShine)" stroke-width="4" />
    <path d="M 120,75 L 108,215" stroke="url(#glassShine)" stroke-width="3" />
    <path d="M 45,85 L 63,215" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  </g>

  <!-- FAMOUS OSMANIA BISCUITS (Pair on Table) -->
  <g id="osmaniaBiscuits" transform="translate(1250, 560)">
    <!-- Biscuit 1 (Base) -->
    <g transform="rotate(-8)">
      <ellipse cx="90" cy="70" rx="65" ry="35" fill="#5c2e0b" opacity="0.4" />
      <ellipse cx="85" cy="60" rx="62" ry="32" fill="url(#biscuitGrad)" stroke="#c28236" stroke-width="2" />
      <!-- Biscuit indentation ring -->
      <ellipse cx="85" cy="60" rx="46" ry="22" fill="none" stroke="#995818" stroke-width="2" stroke-dasharray="6,4" />
      <circle cx="85" cy="60" r="5" fill="#803f13" />
    </g>

    <!-- Biscuit 2 (Leaning) -->
    <g transform="translate(45, -25) rotate(15)">
      <ellipse cx="85" cy="60" rx="62" ry="32" fill="url(#biscuitGrad)" stroke="#fbe4b5" stroke-width="2" />
      <ellipse cx="85" cy="60" rx="46" ry="22" fill="none" stroke="#995818" stroke-width="2" stroke-dasharray="6,4" />
      <circle cx="85" cy="60" r="5" fill="#803f13" />
      <!-- Fluted edge marks -->
      <line x1="25" y1="58" x2="33" y2="59" stroke="#995818" stroke-width="2" />
      <line x1="145" y1="58" x2="137" y2="59" stroke="#995818" stroke-width="2" />
    </g>
  </g>

  <!-- WARM GOLDEN ACCENT PARTICLES & SPARKLES -->
  <g fill="#f6d365" opacity="0.6">
    <circle cx="1080" cy="220" r="3" />
    <circle cx="1140" cy="180" r="2" />
    <circle cx="1200" cy="250" r="3.5" />
    <circle cx="950" cy="310" r="2" />
    <circle cx="1320" cy="380" r="2.5" />
    <circle cx="1020" cy="140" r="1.5" />
  </g>
</svg>

