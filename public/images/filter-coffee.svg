<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="fcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e110a" />
      <stop offset="100%" stop-color="#3d2012" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="40%" stop-color="#fda085" />
      <stop offset="70%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#b85d19" />
    </linearGradient>
    <linearGradient id="coffeeFoam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fae1c3" />
      <stop offset="50%" stop-color="#c98a4a" />
      <stop offset="100%" stop-color="#693714" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#fcBg)" />
  <circle cx="200" cy="130" r="95" fill="#f39c12" opacity="0.12" />
  <!-- Dabara / Davarah (Wide rim brass bowl) -->
  <path d="M 120,150 Q 200,165 280,150 L 260,205 Q 200,225 140,205 Z" fill="url(#steelGrad)" stroke="#b85d19" stroke-width="1.5" />
  <!-- Tumbler cup inside Dabara -->
  <path d="M 160,80 L 170,185 Q 200,195 230,185 L 240,80 Q 200,70 160,80 Z" fill="url(#steelGrad)" stroke="#b85d19" stroke-width="1.5" />
  <!-- Coffee Foam Surface -->
  <ellipse cx="200" cy="80" rx="38" ry="12" fill="url(#coffeeFoam)" />
  <!-- Froth bubbles -->
  <circle cx="190" cy="78" r="4" fill="#fff5ea" opacity="0.6" />
  <circle cx="205" cy="82" r="3" fill="#fff5ea" opacity="0.6" />
  <circle cx="198" cy="84" r="2.5" fill="#fff5ea" opacity="0.6" />
  <!-- Steam -->
  <path d="M 195,65 Q 185,45 198,25" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.35" stroke-linecap="round" />
  <path d="M 208,60 Q 220,40 208,20" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.25" stroke-linecap="round" />
</svg>

