    <circle cx="55" cy="42" r="4" fill="#753d07" />
  </g>
  <!-- Biscuit 2 -->
  <g transform="translate(195, 75) rotate(15)">
    <ellipse cx="55" cy="42" rx="52" ry="28" fill="url(#bisc)" stroke="#fbe4b5" stroke-width="2" />
    <ellipse cx="55" cy="42" rx="38" ry="18" fill="none" stroke="#753d07" stroke-width="1.5" stroke-dasharray="5,3" />
